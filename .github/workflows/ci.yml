name: CI

on:
  push:
    branches: ["main", "pre-prod"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    env:
      # Placeholders so `prisma generate` and `next build` can run without a
      # real database. No migration or query is executed in CI.
      DATABASE_URL: "postgresql://user:password@localhost:5432/switchboard"
      DIRECT_URL: "postgresql://user:password@localhost:5432/switchboard"
      SESSION_SECRET: "ci-placeholder-secret-not-used-anywhere"
      APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
